# Continuous integration.
#
# This runs the tests that need no external databases and no external executables. The
# pipeline's twenty tools and its reference databases are hundreds of gigabytes, so the
# integration tests that invoke them are marked `slow` and run on the cluster, not here.
# What CI protects is the layer where review repeatedly found the real defects: the
# workflow scripts, exercised through the harness in tests/conftest.py.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests workflow

      - name: Test
        run: python -m pytest -q -m "not slow"
