# Continuous integration.
#
# Lints the code and runs the tests that need no reference database. The tests that
# drive the pipeline's external tools are marked `slow` and run on the cluster; a test
# whose tool is not installed is skipped (tests/conftest.py, requires).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests workflow tools

      - name: Test
        run: python -m pytest -q -m "not slow"
