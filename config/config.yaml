# Every threshold the pipeline uses lives here (spec §6). Values are stamped into the run
# manifest and into the output rows they govern, so a result can always be traced to the
# configuration that produced it.

input:
  # The analysis set: the master table with the locked artifact exclusions already applied.
  # The plasmid count is NOT recorded here - it is derived at runtime and written to the
  # manifest (spec §3.1), because a hard-coded denominator silently goes stale.
  master_table: data/plasmidscope_primary/analysis_set.tsv
  # The plasmid sequences, ONE FILE, plain or gzipped. Records outside the analysis set
  # (the exclusion below) are dropped at S0, so this may be the whole working set: the
  # analysis scope is the master table's filter, not the content of this file.
  fasta: data/plasmidscope_primary/provenance/working_set.fna.gz
  # The locked exclusion (spec section 3.1). "Simulated communities" is a PlasmidScope
  # ecosystem artifact, not an environment, and it is excluded from every analysis.
  exclude_hab_top: ["Simulated-artifact"]
  # The study is about SMALL plasmids: size_bp below this. Every plasmid is processed, but
  # the cascade annotates only families holding a small-plasmid protein (rule
  # cascade_selection), and families are labelled small-only or mixed. 20 kb is the
  # antimode of this collection's bimodal size distribution, rounded: Gaussian KDE of
  # log10(size_bp) over
  # the 143,503 plasmids (scipy gaussian_kde, Scott bandwidth) has modes at 4,831 and
  # 96,828 bp and its antimode at 19,011 bp (measured 2026-09-24). The bimodality itself
  # is described by Smillie et al. 2010, Microbiol. Mol. Biol. Rev. 74:434.
  max_plasmid_size_bp: 20000
  # PlasmidScope's per-protein table for its whole ALL set (Li et al., Nucleic Acids Res.
  # 2025, 53:D179), fetched by tools/download_plasmidscope_annotation.sh. Proteins of ours
  # with an identical, eggNOG-annotated protein in it skip the cascade (rule
  # plasmidscope_import, plasmidann.plasmidscope).
  plasmidscope_proteins: data/PlasmidScope/annotation/ALL.protein_list.tsv.gz
  # Host names beyond PLSDB's: PlasmidScope's per-record host (IMG/PR's among them) and the
  # GenBank/RefSeq source organism. With PLSDB species they name a host for 61.1% of the
  # analysis set (98.6% of isolate plasmids, 24.0% of metagenomic ones), against 31.9% for
  # PLSDB alone (plasmidann.hosts, rule clonal_registry).
  host_provenance: data/plasmidscope_primary/provenance/complete_provenance.tsv
  working_set: data/plasmidscope_primary/provenance/working_set.tsv

outdir: results

orf:
  # The gene caller's own floor. Distinct from the discovery cutoff below (spec §11.1).
  min_call_length_aa: 20
  # Prodigal in metagenomic mode: plasmids are too short and too compositionally varied to
  # train a single-genome model on.
  meta_mode: true
  # A circular record whose first and last bases repeat for at least this many bp carries
  # the assembler's overlap; S0 removes one copy (rule analysis_set). 20 bp is CheckV's
  # direct-terminal-repeat criterion (Nayfach et al. 2021, Nat. Biotechnol. 39:578).
  # Measured: 400 of 400 sampled 'direct terminal repeat' records carry one.
  min_terminal_repeat_bp: 20

discovery:
  # Proteins shorter than this are flagged discovery_excluded_short, never deleted (spec §10, §11).
  min_dark_candidate_length_aa: 20

# Reference releases the LABELS carry, so a label can always be traced to the database
# that produced it. A label without its release cannot be reproduced, and a functional
# category built on it cannot be described in a methods section.
references:
  # Pfam family metadata: the description, type and clan that --domtblout does not carry.
  # The description is what makes a functional grouping possible at all, since a family
  # NAME carries no matchable word. Release read from data/refs/pfam/Pfam.version.gz,
  # which reports 38.2 with 30,134 families.
  pfam_dat: data/refs/pfam/Pfam-A.hmm.dat.gz
  pfam_version: "38.2"
  # The NCBI BLAST database snapshot behind the Swiss-Prot DIAMOND index. The path
  # /sw/data/diamond_databases/Blast/latest resolves to .../20250303-003013.
  swissprot_version: "2025-03-03"
  # T5 is NCBI ClusteredNR (last-updated in its metadata.json), built into
  # data/refs/clustered_nr by tools/download_clustered_nr.sh.
  nr_version: "ClusteredNR 2026-08-30"
  eggnog_version: "5.0.2"
  # PlasmidScope has no release number; the download date identifies the tables used.
  # Its labels come from eggNOG-mapper 2.1.12 (Li et al. 2025).
  plasmidscope_version: "2026-09-23"
  # The pharokka database bundle, from data/refs/pharokka/VERSION_x_y_z. One version
  # covers the phage families (PHROG v4 table), CARD and VFDB together.
  pharokka_db_version: "1.8.0"
  # MacSyFinder model sets: DefenseFinder for S8 defence systems. Only the DefenseFinder
  # and CasFinder models are in this tree (`macsydata list` shows CasFinder-3.1.0 and
  # defense-finder-models-3.1.0); CONJScan is NOT installed here.
  macsyfinder_models: data/refs/macsyfinder
  # CONJScan 2.1.0 (Cury et al. 2020, Methods Mol. Biol. 2075:265; the Plasmids models of
  # Coluzzi et al. 2022, Mol. Biol. Evol. 39:msac115), in its own tree, installed with
  # tools/install_tool_envs.py. Its grammar needs MacSyFinder >= 2.1.6, so it runs from
  # envs/conjscan (conjugation.exe in config/targets.yaml), not from the plasmidann env.
  conjscan_models: data/refs/conjscan
  # KEGG's KO list (rest.kegg.jp/list/ko, verbatim), used ONLY to name the gene symbols of
  # PlasmidScope's Tier 0 KOs in 08_protein_labels/label_disagreements.tsv. KEGG gives no
  # label and no context term. Installed by tools/download_label_dbs.py; the release is in
  # data/refs/labels/kegg_ko/VERSION.
  kegg_ko_list: data/refs/labels/kegg_ko/raw/list_ko.txt

# S4d: plasmid-specific label databases (plasmidann.labeldb). Each is its own label kind in
# 08_protein_labels/protein_labels.tsv; PlasAnn's database and labels are not used.
#   TADB 3.0, BacMet 2.0 (EXP), oriTDB 2.0, mobileOG-db beatrix-1.6 (sequence evidence),
#   dbAPIS and Anti-CRISPRdb 2.2 (experimentally verified entries): DIAMOND blastp
#   --more-sensitive -e 1e-5, tier 1 >=80% identity and >=90% coverage, tier 2 >60% and
#   >70%, coverage on query AND subject (tiers from Islam et al. 2026, Nucleic Acids Res.).
#   CARD protein homolog models: Perfect / Strict on the curated per-model bitscore
#   cut-off (Alcock et al. 2023, Nucleic Acids Res. 51:D690).
# The thresholds are constants of plasmidann.labeldb, cited there, not settings.
labels:
  # One directory per database (<db>/VERSION, <db>.faa; card/card.json), written by
  # tools/download_label_dbs.py.
  dir: data/refs/labels
  # true: a database directory that is absent fails pre-flight and the stage. The run is
  # meant to annotate everything in one submission, so a missing database must stop it in
  # seconds rather than become a NOT_RUN row found after the run.
  required: true

# NCBI AMRFinderPlus (Feldgarden et al. 2021, Sci. Rep. 11:12728) in protein mode with
# --plus: AMR, stress (metal, biocide, acid, heat) and virulence elements, by its own
# curated rules. Its own environment and database (tools/install_tool_envs.py).
amrfinder:
  executable: envs/amrfinder/bin/amrfinder
  # The database directory holds version.txt, which every amrfinder_gene row carries.
  database: data/refs/amrfinder/latest
  required: true

qc:
  # Spec §9.3. A protein whose coding region is mostly antisense to a longer ORF on the
  # opposite strand is the classic shadow-ORF artifact: it passes the whole cascade cleanly
  # because it is not a protein and no database contains it. Flag, never delete.
  max_opposite_strand_overlap_fraction: 0.6
  antifam:
    db: data/refs/antifam/AntiFam.hmm
    # AntiFam's curated per-family gathering thresholds. Measured on this database: 274 of
    # 278 profiles carry a GA looser than E=1e-5, so a blanket E-value floor would override
    # the curator across essentially the whole database (Eberhardt et al. 2012, Database
    # 2012:bas003).
    threshold: cut_ga

cascade:
  # Spec §15. Two different decisions that an earlier design conflated into one number.
  narrow_at: 0.9      # how explained before we STOP SEARCHING (compute)
  min_explained: 0.5  # how explained before we call it ANNOTATED (science)
  # Fraction of proteins that bypass narrowing and are searched by every tier, so the cost
  # of narrowing is measurable rather than assumed (spec §61).
  sweep_cohort_fraction: 0.02

controls:
  # Spec §58. Positive controls test recall; negative controls test the opposite direction.
  positive:
    raw_faa: data/refs/control/raw.faa
    n: 500
  negative:
    # Decoys are built by shuffling real plasmid CDS while preserving length and amino-acid
    # composition, plus reverse-complement translations of real CDS. Both must come out DARK
    # and must not receive a confident functional annotation.
    n_shuffled: 250
    n_reverse_complement: 250
    # A decoy shorter than this is not a test of the cascade: nothing would name it, so it
    # would pass the negative control for a reason that has nothing to do with the
    # pipeline behaving correctly. 50 matches the control length floor.
    min_length: 50

# Seed for every stochastic step, so a rerun selects the identical sample (spec §61).
seed: 20260916
