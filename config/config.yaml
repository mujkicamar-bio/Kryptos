# Every threshold the pipeline uses lives here (spec §6). Values are stamped into the run
# manifest and into the output rows they govern, so a result can always be traced to the
# configuration that produced it.

input:
  # The analysis set: the master table with the locked artifact exclusions already applied.
  # The plasmid count is NOT recorded here - it is derived at runtime and written to the
  # manifest (spec §3.1), because a hard-coded denominator silently goes stale.
  working_set_fasta: data/plasmidscope_primary/provenance/working_set.fna.gz
  master_table: data/plasmidscope_primary/analysis_set.tsv
  # The plasmid shards, PREPARED OUTSIDE THE PIPELINE. Every FASTA in this directory is a
  # shard; its name is the file name without the extension. The pipeline no longer creates
  # the partition, so a new batch of plasmids is one more file here: the per-shard stages
  # run for it alone, and only the aggregating stages re-run. An empty directory is an
  # error, because an empty shard set would let every stage succeed while writing nothing.
  shard_dir: data/shards_test
  # The locked exclusion (spec section 3.1). "Simulated communities" is a PlasmidScope
  # ecosystem artifact, not an environment, and it is excluded from every analysis.
  exclude_hab_top: ["Simulated-artifact"]

outdir: results

# The PROTEIN partition only. Plasmid shards are discovered from input.shard_dir and are
# not configured here: the pipeline no longer partitions plasmids.
#
# This one the pipeline must still create itself, because the dereplicated protein set does
# not exist until S2 has run, so there is nothing on disk to discover at load time.
# Changing it between resumed runs invalidates the cascade (spec section 72).
shards:
  protein: 64     # cascade shards over the dereplicated protein set

orf:
  # The gene caller's own floor. Distinct from the discovery cutoff below (spec §11.1).
  min_call_length_aa: 20
  # Prodigal in metagenomic mode: plasmids are too short and too compositionally varied to
  # train a single-genome model on.
  meta_mode: true

discovery:
  # Proteins shorter than this are flagged discovery_excluded_short, never deleted (spec §10, §11).
  min_dark_candidate_length_aa: 20

# Reference releases the LABELS carry, so a label can always be traced to the database
# that produced it. A label without its release cannot be reproduced, and a functional
# category built on it cannot be described in a methods section.
references:
  # Pfam family metadata: the description, type and clan that --domtblout does not carry.
  # The description is what makes a functional grouping possible at all, since a family
  # NAME carries no matchable word. Release read from data/refs/pfam/Pfam.version.gz,
  # which reports 38.2 with 30,134 families.
  pfam_dat: data/refs/pfam/Pfam-A.hmm.dat.gz
  pfam_version: "38.2"
  # The NCBI BLAST database snapshot behind the DIAMOND indexes. The path
  # /sw/data/diamond_databases/Blast/latest resolves to .../20250303-003013.
  swissprot_version: "2025-03-03"
  nr_version: "2025-03-03"
  eggnog_version: "5.0.2"
  # MacSyFinder model sets: DefenseFinder for S8 defence systems. macsydata reports
  # CONJScan 2.1.0 installed in the same tree.
  macsyfinder_models: data/refs/macsyfinder
  # Grouping tool labels into functional categories. null means no grouping: every
  # (kind, label) is its own category. The categories are derived from the observed
  # vocabulary in results/s4c/protein_labels.tsv after a full annotation run; see
  # config/label_categories.yaml.
  label_categories: null

qc:
  # Spec §9.3. A protein whose coding region is mostly antisense to a longer ORF on the
  # opposite strand is the classic shadow-ORF artifact: it passes the whole cascade cleanly
  # because it is not a protein and no database contains it. Flag, never delete.
  max_opposite_strand_overlap_fraction: 0.6
  antifam:
    db: data/refs/antifam/AntiFam.hmm
    # AntiFam's curated per-family gathering thresholds. Measured on this database: 274 of
    # 278 profiles carry a GA looser than E=1e-5, so a blanket E-value floor would override
    # the curator across essentially the whole database (Eberhardt et al. 2012, Database
    # 2012:bas003).
    threshold: cut_ga

cascade:
  # Spec §15. Two different decisions that an earlier design conflated into one number.
  narrow_at: 0.9      # how explained before we STOP SEARCHING (compute)
  min_explained: 0.5  # how explained before we call it ANNOTATED (science)
  # Fraction of proteins that bypass narrowing and are searched by every tier, so the cost
  # of narrowing is measurable rather than assumed (spec §61).
  sweep_cohort_fraction: 0.02

controls:
  # Spec §58. Positive controls test recall; negative controls test the opposite direction.
  positive:
    raw_faa: data/refs/control/raw.faa
    n: 500
  negative:
    # Decoys are built by shuffling real plasmid CDS while preserving length and amino-acid
    # composition, plus reverse-complement translations of real CDS. Both must come out DARK
    # and must not receive a confident functional annotation.
    n_shuffled: 250
    n_reverse_complement: 250

# Seed for every stochastic step, so a rerun selects the identical sample (spec §61).
seed: 20260916
