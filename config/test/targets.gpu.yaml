# config/targets.yaml with structure.gpu enabled, for the test-set GPU run.
quality_gate:
  min_control_recall: 0.99
  control_fasta: data/refs/control/positive_control.faa
  min_controls: 100
  require_control_set: true
rarity:
  rare_max_lineages: 3
  widely_conserved_min_lineages: 50
  cross_min_mob: 3
  cross_min_hosts: 5
  cross_min_genera: 3
  rarefaction_replicates: 20
lineage:
  max_distance: 0.05
  max_pvalue: 1.0e-10
  kmer: 21
  sketch_size: 1000
clustering:
  resolutions:
    close:
      min_seq_id: 0.9
      coverage: 0.8
    intermediate:
      min_seq_id: 0.5
      coverage: 0.8
    broad:
      min_seq_id: 0.3
      coverage: 0.5
  primary: broad
  cov_mode: 0
  cluster_mode: 0
evolution:
  min_codons: 20
  min_members_for_dnds: 3
  dnds_purifying_max: 0.5
  rnacode_max_p: 0.05
  max_members_aligned: 50
orthology:
  data_dir: data/refs/eggnog
  required: false
defence:
  required: false
context:
  max_operon_gap: 100
  neighbourhood_window: 3
structure:
  scope: representatives
  gpu: true
  max_evalue: 0.001
  required: true
