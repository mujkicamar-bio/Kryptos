# config/targets.yaml with structure.gpu enabled, for the test-set GPU run.
quality_gate:
  min_control_recall: 0.99
  control_fasta: data/refs/control/positive_control.faa
  min_controls: 100
  require_control_set: true
rarity:
  rare_max_lineages: 3
  widely_conserved_min_lineages: 50
  cross_min_hosts: 2
  cross_min_genera: 2
  rarefaction_replicates: 20
lineage:
  max_distance: 0.05
  max_pvalue: 1.0e-10
  kmer: 21
  sketch_size: 1000
clustering:
  resolutions:
    close:
      min_seq_id: 0.9
      coverage: 0.8
    intermediate:
      min_seq_id: 0.5
      coverage: 0.8
    broad:
      min_seq_id: 0.3
      coverage: 0.5
  primary: intermediate
  cov_mode: 1
  cluster_mode: 2
network:
  node_resolution: intermediate
  min_cov: 0.5
  max_evalue: 0.0001
  max_out_edges: 4
  dark_brightness: 0.05
evolution:
  min_codons: 20
  min_members_for_dnds: 3
  dnds_purifying_max: 0.5
  rnacode_max_p: 0.05
  max_members_aligned: 50
orthology:
  data_dir: data/refs/eggnog
  required: false
defence:
  required: false
conjugation:
  required: false
  exe: envs/conjscan/bin/macsyfinder
  version: "2.1.0"
context:
  max_operon_gap: 100
  neighbourhood_window: 3
synteny:
  levels: [close, intermediate]
  min_lineages: 2
cooccurrence:
  min_lineages_together: 2
  fdr: 0.05
structure:
  scope: representatives
  gpu: true
  max_evalue: 0.001
  required: true
