# Test-scale configuration: the 100-plasmid smoke set.
#
# Run with:
#   envs/plasmidann/bin/snakemake -s workflow/Snakefile --configfile config/test/config.yaml -c 8
#
# Overrides config/config.yaml, which the Snakefile always loads first. Everything a
# smaller set forces is here and nowhere else, so the production config is never edited
# to run a test.
#
#   fasta       the seeded 100-plasmid sample from tools/make_test_set.py, covering
#               circular, linear, direct terminal repeat and inverted terminal repeat
#               in two size bands, so both the origin-repair branch and the branch that
#               must NOT get repair are exercised.
#   outdir      results_test, so a smoke run never overwrites a production run.
input:
  master_table: data/plasmidscope_primary/analysis_set.tsv
  fasta: data/test_plasmids.fna
  exclude_hab_top:
  - Simulated-artifact
  max_plasmid_size_bp: 20000
  plasmidscope_proteins: data/PlasmidScope/annotation/ALL.protein_list.tsv.gz
  # Host names beyond PLSDB's: PlasmidScope's per-record host (IMG/PR's among them) and the
  # GenBank/RefSeq source organism. With PLSDB species they name a host for 61.1% of the
  # analysis set (98.6% of isolate plasmids, 24.0% of metagenomic ones), against 31.9% for
  # PLSDB alone (plasmidann.hosts, rule clonal_registry).
  host_provenance: data/plasmidscope_primary/provenance/complete_provenance.tsv
  working_set: data/plasmidscope_primary/provenance/working_set.tsv
outdir: results_test
orf:
  min_call_length_aa: 20
  # A circular record whose first and last bases repeat for at least this many bp carries
  # the assembler's overlap; S0 removes one copy (rule analysis_set). 20 bp is CheckV's
  # direct-terminal-repeat criterion (Nayfach et al. 2021, Nat. Biotechnol. 39:578).
  # Measured: 400 of 400 sampled 'direct terminal repeat' records carry one.
  min_terminal_repeat_bp: 20
discovery:
  min_dark_candidate_length_aa: 20
references:
  pfam_dat: data/refs/pfam/Pfam-A.hmm.dat.gz
  pfam_version: '38.2'
  swissprot_version: '2025-03-03'
  nr_version: '2025-03-03'
  eggnog_version: 5.0.2
  # The pharokka database bundle, from data/refs/pharokka/VERSION_x_y_z. One version
  # covers the phage families (PHROG v4 table), CARD and VFDB together.
  pharokka_db_version: "1.8.0"
  macsyfinder_models: data/refs/macsyfinder
  conjscan_models: data/refs/conjscan
  kegg_ko_list: data/refs/labels/kegg_ko/raw/list_ko.txt
labels:
  dir: data/refs/labels
  required: true
amrfinder:
  executable: envs/amrfinder/bin/amrfinder
  database: data/refs/amrfinder/latest
  required: true
genomad:
  executable: envs/genomad/bin/genomad
  database: data/refs/genomad/genomad_db
qc:
  max_opposite_strand_overlap_fraction: 0.6
seed: 20260916
cascade_config: config/test/cascade.yaml
