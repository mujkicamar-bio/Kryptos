# =====================================================================================
# Annotation cascade configuration
#
# Every threshold the cascade uses is declared here, none in Python. Each is checked
# against config/schemas/cascade.schema.yaml and plasmidann.cascade.check_thresholds(),
# and written into the output rows it governs.
#
# The rationale for the specific values, and for -Z and --cut_ga, is in
# docs/annotation_statistics.md.
# =====================================================================================

# --- Narrowing -------------------------------------------------------------------------
# narrow_at: a protein stops at the tier where its explained fraction reaches narrow_at and
# is not sent to deeper tiers. A protein withheld after T2 has no T3 or T4 result. (T5 is
# unaffected: a protein can only reach narrow_at through Pfam or Swiss-Prot spans, and T5
# skips every protein those named, skip_if_named_by.) Measured, 0.3 -> 0.8 moved the
# deep-tier set by 76%. check_thresholds() enforces narrow_at >= min_coverage.
#
# 0.7 is a user decision (2026-09-25); no published source sets it.
narrow_at: 0.7

# --- Classification ------------------------------------------------------------------
# Merged INFORMATIVE coverage at or above which a protein counts as FUNCTIONAL rather than
# DOMAIN_ONLY. Applied to the whole protein, never to a single alignment: a replication
# initiator carrying RepA_N and Bac_RepA_C is completely annotated even though neither
# domain alone clears this. Per-hit classification put 17% of Pfam-hit proteins into
# DOMAIN_ONLY at >=50% explained, and DOMAIN_ONLY is target-eligible.
min_coverage: 0.5

# Completeness bands. Informative about ANNOTATED proteins; constant NONE across the dark
# set by construction, where dark_covered_fraction is the discriminating axis instead.
full_at: 0.8
partial_at: 0.5

# --- Search statistics ---------------------------------------------------------------
# One database size for every hmmer tier, passed as -Z and --domZ.
#
# hmmsearch reports E = (sequences searched) x P(score | null), and by default the first
# term is the actual input size. T2's input is whatever T1 could not resolve, so without
# -Z the same cut means a different significance on every tier and moves whenever
# anything upstream changes. Measured: the same alignment reports 4.1e-36 / 4.1e-35 /
# 4.1e-34 at 200 / 2,000 / 20,000 queries.
#
# The value is the number of sequences the cascade actually searches, so an E-value means
# "expected false positives across the whole study". Every unique protein is counted,
# including those PlasmidScope annotates, which skip the cascade (rule
# plasmidscope_import), and those the selection does not search (rule cascade_selection):
# E-values then do not move with PlasmidScope's coverage or the selection, and the
# larger -Z is the conservative choice for the dark set.
#   9,317,050 ORFs -> 3,497,616 unique proteins
#   (results/03_dereplication/unique_proteins.faa)
# Recompute and update this if S1/S2 are re-run on a different analysis set; rule
# check_hmmer_z stops the run after dereplication if the count differs by more than 2%,
# and names the value.
hmmer_z: 3497616

# DIAMOND reports at most this many targets per query. 25 is DIAMOND's own default. With
# 5, on the nr benchmark (results_bench, 3,714 queries with hits) 1,627 queries (44%)
# filled all five slots with uninformative "hypothetical protein" hits, so an informative
# hit ranked sixth or lower was never seen. The limit also enters DIAMOND's search
# heuristic, not only its reporting (Shah et al., Bioinformatics 2019, 35:1613).
max_target_seqs: 25

# --- Search clustering ---------------------------------------------------------------
# The search clustering (rule cascade_selection). The proteins the cascade annotates
# are clustered at this identity and coverage; only the representatives are searched and
# each member takes its representative's result (cascade_resolve, annot_source).
#   90% identity: UniRef90 (Suzek et al. 2015, Bioinformatics 31:926), where cluster
#     members are treated as functionally equivalent for annotation.
#   80% coverage of BOTH sequences (cov-mode 0): the member and the representative then
#     differ in length by at most ~20%, so the representative's hits cannot describe a
#     domain the member lacks. Stricter than the families' cov-mode 1 on purpose: the
#     families only group, this copies an annotation.
#   cluster-mode 2: greedy by length, as for the families (FESNov).
# Measured on PlasmidScope's proteins (2026-09-24): 356,959 selected proteins -> 216,546
# representatives (cov-mode 1 would give 196,973).
search_clustering:
  min_seq_id: 0.9
  coverage: 0.8
  cov_mode: 0
  cluster_mode: 2

# --- Tiers ---------------------------------------------------------------------------
# Tier order IS authority order: annot_label comes from the shallowest tier that named
# the protein (cascade.classify), and homology_depth is
# the tier's position in this list. mmseqs2 is reserved for S6; the cascade uses native
# tools only.
#
# max_evalue is the significance floor applied at PARSE time, before a hit may contribute
# a span, a label or a row. null means "this tier has no E-value criterion".
#
#   T1 is null deliberately. Pfam gathering thresholds are per-family bit-score cutoffs
#   set by hand by each family's curator; for some short, low-information families GA is
#   looser than any global cut. A blanket floor would override curation and degrade the
#   highest-quality signal in the cascade.
tiers:
  - id: T1
    method: hmmer
    source: pfam
    db: data/refs/pfam/Pfam-A.hmm
    args: "--cut_ga"
    max_evalue: null
    note: >
      Pfam-A 38.2 at curated gathering thresholds. A hit here is Pfam's own assertion of
      family membership, not our inference. High precision, deliberately low recall.

  - id: T2
    method: hmmer
    source: pfam
    db: data/refs/pfam/Pfam-A.hmm
    args: "-E 1e-5 --domE 1e-5 --incdomE 1e-5"
    max_evalue: 1.0e-5
    note: >
      The same database below the curatorial bar, recovering divergent homologues - which
      is most of the plasmid mobilome. Kept as a separate, clearly lower-authority claim so
      it can be down-weighted or stripped downstream. --domE is essential: -E sets only the
      SEQUENCE threshold, and without it every domain of a passing sequence is counted;
      7.2% of T2 resolutions depended on domains that were not individually significant.
      DECIDED: this threshold stays at 1e-5. Measured over Pfam-A 38.2, the curated GA of
      29,074 of 30,134 families (96.5%) corresponds to an E-value looser than 1e-5 at
      Z=3,497,616 - median E-at-GA 7.6e-4, median GA 27.0 bits against the 32.9 bits
      E=1e-5 demands. So for most families T2 is the stricter of the two tiers and adds
      little beyond re-finding T1's domains, and it does its intended sub-GA job only for
      the remaining 3.5%. Loosening it would open a real sub-GA band at the cost of false
      positives across 3.5M queries, and a false positive here permanently removes a
      genuine dark protein from the pool. That trade was considered and declined: precision
      at the deepest tiers is worth more to this project than sub-GA recall. The
      measurement is kept in docs/annotation_statistics.md section 2 so the choice is on
      the record.

  - id: T3
    method: pharokka
    source: pharokka
    db: data/refs/pharokka
    exe: envs/pharokka/bin/pharokka
    args: ""
    # pharokka's own default for every search it runs, and the same floor as the DIAMOND
    # tiers. Applied by pharokka itself, to MMseqs2 and pyhmmer alike.
    max_evalue: 1.0e-5
    note: >
      The phage tier: pharokka in protein mode, against the prokaryotic
      virus protein families as a MMseqs2 profile database and as HMMER3 profiles, plus
      CARD and VFDB in the same run. Placed before Swiss-Prot so it searches only what
      Pfam could not explain. A hit carries a family, an annotation, a functional
      category and an E-value, and NO alignment span - pharokka deletes its raw
      alignments on exit - so it is a family-level assignment: FUNCTIONAL if the family
      is named, with annot_completeness NOT_MEASURED. Most families are named
      'hypothetical protein', which is_informative rejects here exactly as elsewhere.

  - id: T4
    method: diamond
    source: swissprot
    db: /sw/data/diamond_databases/Blast/latest/swissprot.dmnd
    args: "--very-sensitive"
    max_evalue: 1.0e-5
    note: >
      Swiss-Prot, 264 MB. Highest label quality available and nearly free; measured to
      clear 16.3% of Pfam's residue in seconds.

  - id: T5
    method: diamond
    source: nr
    db: data/refs/clustered_nr/clustered_nr.dmnd
    args: "--very-sensitive -b 16 -c 1"
    max_evalue: 1.0e-5
    # Decided 2026-09-24: a protein Pfam (T1 or T2) or Swiss-Prot (T4) named keeps that
    # curated name and is not searched against nr, whatever fraction of it they explain.
    # nr is spent only on what the curated databases could not name. pharokka names do
    # not skip nr. Consequence: the unexplained part of a DOMAIN_ONLY protein that Pfam
    # named is not searched in nr.
    skip_if_named_by: [pfam, swissprot]
    # number-of-sequences in data/refs/clustered_nr/metadata.json. Preflight compares the
    # built index against it, so a truncated makedb cannot pass as a finished database.
    expected_sequences: 545597271
    note: >
      NCBI ClusteredNR (2026-08-30): nr clustered at 90% identity and 90% length, one
      representative per cluster - 545.6M sequences, 173.6G residues, against 707M and
      273G for the 2025-03-03 nr it replaces (tools/download_clustered_nr.sh). Newer, and
      about 0.64x the residues to search. Reaches environmental sequence nothing else
      has. UniRef90 is not a tier: it was measured at 3-11 days for little beyond what nr
      provides. -b 16 -c 1 as benchmarked on full nr
      (job 6928733): 1.7 s per query
      and ~45 min fixed per pass there; ClusteredNR is not benchmarked, and is expected
      at about 0.64x of both. DIAMOND scales E-values by the database size, and
      ClusteredNR is 0.64x the letters of nr: the same 1e-5 is ~0.65 bits more permissive
      than on full nr, so E-values here are not comparable with the full-nr benchmark
      (results_bench). The size is not pinned with --dbsize; the methods state it.

# --- Artefact screen (S2b) -----------------------------------------------------------
# AntiFam is Pfam's companion database of profiles built to match sequences that are NOT
# proteins: shadow ORFs on the reverse-complement strand of real genes, translated rRNA
# and tRNA, and repeat-derived ORFs.
#
# These matter disproportionately here. Our selection criterion is "nothing named it", and
# a shadow ORF is by construction something nothing named - because it is not a protein
# and no database contains it. It passes the entire cascade cleanly. Worse, these
# artefacts are CONSERVED, because the real feature underneath them is conserved, so they
# also survive multi-lineage and selection tests. Plasmids are high-yield for them:
# gene-dense, GC-skewed, saturated with mobile elements.
#
# A hit here sets artefact_flag; it never deletes a protein.
artefact_screen:
  antifam_db: data/refs/antifam/AntiFam.hmm
  # AntiFam's own curated gathering thresholds, exactly as T1 uses Pfam's.
  #
  # MEASURED: all 278 AntiFam profiles carry a GA line, and 274 of them (98.6%) are looser
  # than E=1e-5 at Z=3,497,616. The median curated cut corresponds to E=7.3e-4, about 73x
  # looser; the loosest, Spurious_ORF_67, to E=0.195. A blanket -E 1e-5 would override the
  # curator across essentially the whole database. Eberhardt et al. 2012 (Database
  # 2012:bas003) built these thresholds per family for this
  # purpose; a global floor is not an improvement on them.
  antifam_args: "--cut_ga"
  # null means "the curated threshold decided this" - no further floor. Same convention and
  # same code path as a cascade tier's max_evalue.
  antifam_max_evalue: null
  # tantan (Frith 2011, Nucleic Acids Res. 39:e23) masks low-complexity regions; a protein
  # masked beyond this fraction is flagged. No published protein-level cut-off was found,
  # so the value is measured: over the 482,697 proteins of the Swiss-Prot DIAMOND database
  # used by tier T4 (tantan 51, -p, 2026-09-28), the masked fraction has median 0, 90th
  # percentile 0.138 and 99th percentile 0.516; 5,223 proteins (1.08%) exceed 0.5. The
  # cut-off therefore flags about 1% of manually reviewed proteins.
  max_low_complexity_fraction: 0.5
