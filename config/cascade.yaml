# Tier order IS authority order. Each tier sees only what the previous could not name.
# Thresholds are pre-registered here and written into every output row (design P5).
tiers:
  - {id: T1, method: hmmer,  db: data/refs/pfam/Pfam-A.hmm, args: "--cut_ga",  note: "Pfam-A 38.2 curated gathering thresholds"}
  - {id: T2, method: hmmer,  db: data/refs/pfam/Pfam-A.hmm, args: "-E 1e-5",   note: "sub-GA Pfam homology"}
  - {id: T3, method: mmseqs, db: /sw/data/MMseqs2_data/latest/rackham/VOGDB,    args: "-s 5.7 -e 1e-3", note: "viral orthologous groups"}
  - {id: T4, method: mmseqs, db: /sw/data/MMseqs2_data/latest/rackham/UniRef90, args: "-s 5.7 -e 1e-3", note: "close sequence homology"}
  - {id: T5, method: mmseqs, db: /sw/data/MMseqs2_data/latest/rackham/UniRef50, args: "-s 7.5 -e 1e-3", note: "mid-range homology"}
  - {id: T6, method: mmseqs, db: /sw/data/MMseqs2_data/latest/rackham/eggNOG,   args: "-s 7.5 -e 1e-3", note: "orthology"}
  - {id: T7, method: mmseqs, db: /sw/data/MMseqs2_data/latest/rackham/NR,       args: "-s 7.5 -e 1e-3", note: "exhaustive sequence"}
  - {id: T8, method: mmseqs, db: /sw/data/MMseqs2_data/latest/rackham/PDB70,    args: "-s 7.5 -e 1e-3", note: "structural profile"}
