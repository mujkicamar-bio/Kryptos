# =====================================================================================
# S5 onwards: the evidence recorded for every dark family. Nothing is ranked or selected;
# the 1,000 proteins for follow-up are chosen by hand from the report.
#
# The cascade's thresholds live in config/cascade.yaml. These are the downstream ones.
# Same rule applies (design principle P4): declared here, schema-validated, and stamped
# into the output rows they govern.
# =====================================================================================

# --- S5 quality gate -----------------------------------------------------------------
quality_gate:
  min_control_recall: 0.99
  control_fasta: data/refs/control/positive_control.faa
  min_controls: 100
  require_control_set: true
# --- Stage 14: rarity, conservation and rarefaction (spec sections 54-55) -------------
#
# Rarity and conservation are SEPARATE descriptors (section 54). The labels are not a
# ranking - RARE is not better than WIDELY_CONSERVED - and section 54 requires the
# thresholds to be explicit, so they are here and travel on every labelled row.
#
# Every breadth threshold is counted in INDEPENDENT LINEAGES from Stage 7, never in plasmid
# records: a family on four hundred redepositions of one plasmid is one observation, and
# section 34.2 forbids treating record counts as independent observations.
rarity:
  # At or below this many independent lineages a family is RARE. 3 is the smallest count
  # that can distinguish a repeated observation from a single one; it is a descriptive
  # boundary and nothing selects on it.
  rare_max_lineages: 3
  # At or above this many, WIDELY_CONSERVED.
  widely_conserved_min_lineages: 50
  cross_min_hosts: 2
  cross_min_genera: 2
  # Random orderings averaged for the rarefaction curve. A single ordering is one arbitrary
  # curve and the shape is the entire output, so it must not be an artefact of one shuffle.
  rarefaction_replicates: 20

# --- Stage 6: plasmid lineage / independence (spec section 33) ------------------------
#
# MOB classification and plasmid sequence similarity are separate concepts (section 33).
# This measures the second: how many INDEPENDENT plasmid lineages a protein occurs on,
# which is the denominator any recurrence claim needs. Section 33.2's example - 2,143
# plasmid occurrences, 8 MOB clusters, 47 independent clusters - is the reason.
lineage:
  # Mash distance below which two plasmids are the same lineage. 0.05 is approximately 95%
  # ANI (Ondov et al. 2016). That is a NEAR-IDENTICAL lineage, much finer than a plasmid
  # taxonomic unit (PTU; Redondo-Salvo et al. 2020, Nat. Commun. 11:3602), and the text
  # must call it a lineage, not a PTU. The cluster count is a direct function of this, so
  # it is recorded on every row of the output.
  max_distance: 0.05
  # Mash reports a small distance from very few shared hashes, and says so with a large
  # p-value. Distance alone would link plasmids sharing almost nothing.
  max_pvalue: 1.0e-10
  # Mash defaults (Ondov et al. 2016, Genome Biol 17:132). k=21 is their recommendation for
  # genome-scale comparisons; s=1000 is the default sketch size and the accuracy/size
  # trade-off they characterise.
  kmer: 21
  sketch_size: 1000

# --- Stage 5: protein families (spec section 31) --------------------------------------
#
# Clustering runs over EVERY unique protein, not only the dark ones. Spec section 31.2
# requires dark_member_count, annotated_member_count and percentage_dark_in_family, and
# section 32 DERIVES a dark family as percentage_dark_in_family = 100% - none of which can
# be computed from a clustering that contains only dark proteins.
#
# Three resolutions, as section 31.4 asks for, with thresholds stated rather than implied:
#
#   close         90% identity, 80% coverage. Near-identical proteins; separates true
#                 orthologues from a diverged family.
#   intermediate  50% / 80%. The conventional homology bar.
#   broad         30% / 50%, cov-mode 1, cluster-mode 2: FESNov's own family clustering of
#                 ~400 million genes (Rodriguez del Rio et al. 2024, Nature 626:377,
#                 Methods: --min-seq-id 0.3 -c 0.5 --cov-mode 1 --cluster-mode 2).
#
# `primary` names the resolution that IS the protein family: every stage that needs one
# family per protein reads it (cascade selection, dark families, synteny, rarity in the
# report). Decided 2026-09-25: intermediate (50% identity, 80% coverage; the UniRef50
# analogue). close and broad are computed and reported beside it, never used as the family.
clustering:
  resolutions:
    close:
      min_seq_id: 0.9
      coverage: 0.8
    intermediate:
      min_seq_id: 0.5
      coverage: 0.8
    broad:
      min_seq_id: 0.3
      coverage: 0.5
  primary: intermediate
  # FESNov (Rodriguez del Rio et al., Nature 2024, Methods): --cov-mode 1 --cluster-mode 2,
  # i.e. coverage of the member and greedy length-ordered clustering; -e 0.001 is the
  # MMseqs2 default and is not overridden. Applied at every resolution.
  cov_mode: 1
  cluster_mode: 2
# Stage 5b family network, built as Durairaj et al. built theirs over UniRef50 (Nature 2023,
# 622:646, Methods): nodes are the `intermediate` 50%-identity clusters; an edge is an
# MMseqs2 hit covering at least 50% of EITHER protein at E < 1e-4, at most four outbound
# edges per node; a node is dark when its best-annotated member reaches no more than 5%
# annotation coverage ("functional brightness"). node_resolution names the clustering
# whose clusters are the nodes; `intermediate` (50% identity) is the UniRef50 analogue.
network:
  node_resolution: intermediate
  min_cov: 0.5
  max_evalue: 1.0e-4
  max_out_edges: 4
  dark_brightness: 0.05
evolution:
  min_codons: 20
  min_members_for_dnds: 3
  dnds_purifying_max: 0.5
  rnacode_max_p: 0.05
  max_members_aligned: 50
orthology:
  data_dir: data/refs/eggnog
  required: false
defence:
  required: false
conjugation:
  # CONJScan 2.1.0, Plasmids models, run by the MacSyFinder 2.1.6 of envs/conjscan (the
  # plasmidann env pins MacSyFinder 2.1.4 for DefenseFinder, which cannot read CONJScan's
  # grammar 2.1). false, as for defence: absent models or executable record NOT_RUN;
  # pre-flight still refuses an installed executable too old for the installed models.
  required: false
  exe: envs/conjscan/bin/macsyfinder
  # The release the calls are stamped with; the stage fails if the installed models differ.
  version: "2.1.0"
context:
  max_operon_gap: 100
  neighbourhood_window: 3
synteny:
  # Stage 9 is measured at both levels: close (90% identity, a gene is near-identical
  # sequence) and intermediate (the protein family, clustering.primary, which must be
  # listed). The family table reads the primary rows, the ORF table the close rows.
  levels: [close, intermediate]
  # Fewer voting lineages than this gives TOO_FEW_LINEAGES and no value: conservation
  # across one lineage is one observation, so 2 is the arithmetic minimum (spec 2.9).
  min_lineages: 2
cooccurrence:
  # S8g: dark family pairs that share a plasmid, counted per Stage 6 lineage. A pair
  # together in one lineage is one observation, and two singleton families on one plasmid
  # would get p = 1/N from it, so 2 is the minimum tested - the same minimum as
  # synteny.min_lineages (spec 2.9). No published source sets it.
  min_lineages_together: 2
  # Benjamini-Hochberg false discovery rate (Benjamini & Hochberg 1995, J R Stat Soc B
  # 57:289) at which the report counts a partner; 0.05 is the conventional level, and the
  # pair table carries every q-value, so another level can be applied to it.
  fdr: 0.05
structure:
  scope: representatives
  gpu: false
  max_evalue: 0.001
  required: true
