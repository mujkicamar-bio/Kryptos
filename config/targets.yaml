# =====================================================================================
# S5-S9: from the annotated plasmidome to 1,000 screening candidates.
#
# The cascade's thresholds live in config/cascade.yaml. These are the downstream ones.
# Same rule applies (design principle P4): declared here, schema-validated, and stamped
# into the output rows they govern.
# =====================================================================================

# --- S5 quality gate -----------------------------------------------------------------
quality_gate:
  min_control_recall: 0.99
  control_fasta: data/refs/control/positive_control.faa
  min_controls: 100
  require_control_set: true
# --- Stage 14: rarity, conservation and rarefaction (spec sections 54-55) -------------
#
# Rarity and conservation are SEPARATE descriptors (section 54). The labels are not a
# ranking - RARE is not better than WIDELY_CONSERVED - and section 54 requires the
# thresholds to be explicit, so they are here and travel on every labelled row.
#
# Every breadth threshold is counted in INDEPENDENT LINEAGES from Stage 7, never in plasmid
# records: a family on four hundred redepositions of one plasmid is one observation, and
# section 34.2 forbids treating record counts as independent observations.
rarity:
  # At or below this many independent lineages a family is RARE. 3 is the smallest count
  # that can distinguish a repeated observation from a single one; it is a descriptive
  # boundary and nothing selects on it.
  rare_max_lineages: 3
  # At or above this many, WIDELY_CONSERVED.
  widely_conserved_min_lineages: 50
  cross_min_mob: 3
  cross_min_hosts: 5
  cross_min_genera: 3
  # Random orderings averaged for the rarefaction curve. A single ordering is one arbitrary
  # curve and the shape is the entire output, so it must not be an artefact of one shuffle.
  rarefaction_replicates: 20

# --- Stage 6: plasmid lineage / independence (spec section 33) ------------------------
#
# MOB classification and plasmid sequence similarity are separate concepts (section 33).
# This measures the second: how many INDEPENDENT plasmid lineages a protein occurs on,
# which is the denominator any recurrence claim needs. Section 33.2's example - 2,143
# plasmid occurrences, 8 MOB clusters, 47 independent clusters - is the reason.
lineage:
  # Mash distance below which two plasmids are the same lineage. 0.05 is approximately 95%
  # ANI, the conventional species-level boundary and the usual bar for "same plasmid
  # lineage". The cluster count is a direct function of this, so it is recorded on every
  # row of the output.
  max_distance: 0.05
  # Mash reports a small distance from very few shared hashes, and says so with a large
  # p-value. Distance alone would link plasmids sharing almost nothing.
  max_pvalue: 1.0e-10
  # Mash defaults (Ondov et al. 2016, Genome Biol 17:132). k=21 is their recommendation for
  # genome-scale comparisons; s=1000 is the default sketch size and the accuracy/size
  # trade-off they characterise.
  kmer: 21
  sketch_size: 1000

# --- Stage 5: protein families (spec section 31) --------------------------------------
#
# Clustering runs over EVERY unique protein, not only the dark ones. Spec section 31.2
# requires dark_member_count, annotated_member_count and percentage_dark_in_family, and
# section 32 DERIVES a dark family as percentage_dark_in_family = 100% - none of which can
# be computed from a clustering that contains only dark proteins.
#
# Three resolutions, as section 31.4 asks for, with thresholds stated rather than implied:
#
#   close         90% identity, 80% coverage. Near-identical proteins; separates true
#                 orthologues from a diverged family.
#   intermediate  50% / 80%. The conventional homology bar.
#   broad         30% / 50%. FESNov's deep-homology setting (Nature 626:377), deliberately
#                 looser than the 70/80 they used on 1.17 billion metagenomic sequences:
#                 this collection has 3.5 million, and at 70% real families fragment into
#                 singletons.
#
# `primary` names the resolution the downstream stages read when they need one family per
# protein. The others are computed and reported beside it.
clustering:
  resolutions:
    close:
      min_seq_id: 0.9
      coverage: 0.8
    intermediate:
      min_seq_id: 0.5
      coverage: 0.8
    broad:
      min_seq_id: 0.3
      coverage: 0.5
  primary: broad
  cov_mode: 0
  cluster_mode: 0
evolution:
  min_codons: 20
  min_members_for_dnds: 3
  dnds_purifying_max: 0.5
  rnacode_max_p: 0.05
  max_members_aligned: 50
orthology:
  data_dir: data/refs/eggnog
  required: false
defence:
  required: false
context:
  max_operon_gap: 100
  neighbourhood_window: 3
  min_context_conservation: 0.5
  high_confidence_conservation: 0.9
  max_q_value: 0.05
  min_enrichment: 2.0
structure:
  scope: representatives
  gpu: false
  max_evalue: 0.001
  required: true
