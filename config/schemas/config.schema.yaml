# Validated at workflow load time. A typo in config.yaml must fail in seconds, not in hour 45.
$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required: [input, outdir, orf, discovery, qc, cascade, controls, seed,
           references]
properties:
  input:
    type: object
    required: [master_table, fasta, plasmidscope_proteins, max_plasmid_size_bp,
               host_provenance, working_set]
    properties:
      master_table: {type: string}
      host_provenance: {type: string}
      working_set: {type: string}
      fasta: {type: string}
      max_plasmid_size_bp: {type: integer, minimum: 1}
      plasmidscope_proteins: {type: string}
  outdir: {type: string}
  orf:
    type: object
    required: [min_call_length_aa, meta_mode, min_terminal_repeat_bp]
    properties:
      min_call_length_aa: {type: integer, minimum: 1}
      meta_mode: {type: boolean}
      min_terminal_repeat_bp: {type: integer, minimum: 1}
  discovery:
    type: object
    required: [min_dark_candidate_length_aa]
    properties:
      min_dark_candidate_length_aa: {type: integer, minimum: 1}
  references:
    type: object
    required: [pfam_dat, pfam_version, swissprot_version, nr_version, eggnog_version,
               pharokka_db_version, plasmidscope_version]
    properties:
      pfam_dat: {type: string}
      pfam_version: {type: string}
      swissprot_version: {type: string}
      nr_version: {type: string}
      eggnog_version: {type: string}
      pharokka_db_version: {type: string}
      plasmidscope_version: {type: string}
      macsyfinder_models: {type: string}
  qc:
    type: object
    required: [max_opposite_strand_overlap_fraction, antifam]
    properties:
      max_opposite_strand_overlap_fraction: {type: number, minimum: 0, maximum: 1}
      antifam:
        type: object
        required: [db, threshold]
        properties:
          db: {type: string}
          threshold: {type: string, enum: [cut_ga]}
  cascade:
    type: object
    required: [narrow_at, min_explained, sweep_cohort_fraction]
    properties:
      narrow_at: {type: number, minimum: 0, maximum: 1}
      min_explained: {type: number, minimum: 0, maximum: 1}
      sweep_cohort_fraction: {type: number, minimum: 0, maximum: 1}
  controls:
    type: object
    required: [positive, negative]
    properties:
      positive:
        type: object
        required: [raw_faa, n]
      negative:
        # Every one of these is load-bearing: n_shuffled and n_reverse_complement decide
        # whether the cascade gets a false-positive measurement at all, and min_length
        # decides whether that measurement means anything.
        type: object
        required: [n_shuffled, n_reverse_complement, min_length]
        properties:
          n_shuffled: {type: integer, minimum: 0}
          n_reverse_complement: {type: integer, minimum: 0}
          min_length: {type: integer, minimum: 1}
  seed: {type: integer}
