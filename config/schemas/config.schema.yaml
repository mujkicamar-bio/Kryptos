# Validated at workflow load time. A typo in config.yaml must fail in seconds, not in hour 45.
$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required: [input, outdir, shards, orf, discovery, qc, cascade, controls, seed,
           references]
properties:
  input:
    type: object
    required: [master_table, shard_dir]
    properties:
      master_table: {type: string}
  outdir: {type: string}
  shards:
    type: object
    # plasmid is deliberately absent: those shards are discovered from input.shard_dir,
    # not configured. Only the protein partition is a number the pipeline chooses.
    required: [protein]
    properties:
      protein: {type: integer, minimum: 1}
  orf:
    type: object
    required: [min_call_length_aa, meta_mode]
    properties:
      min_call_length_aa: {type: integer, minimum: 1}
      meta_mode: {type: boolean}
  discovery:
    type: object
    required: [min_dark_candidate_length_aa]
    properties:
      min_dark_candidate_length_aa: {type: integer, minimum: 1}
  references:
    type: object
    required: [pfam_dat, pfam_version, swissprot_version, nr_version, eggnog_version]
    properties:
      pfam_dat: {type: string}
      pfam_version: {type: string}
      swissprot_version: {type: string}
      nr_version: {type: string}
      eggnog_version: {type: string}
      macsyfinder_models: {type: string}
      # null is a valid value: it means no grouping is configured and every (kind, label)
      # is its own category, which is the state until the vocabulary has been reviewed.
      label_categories: {type: [string, "null"]}
  qc:
    type: object
    required: [max_opposite_strand_overlap_fraction, antifam]
    properties:
      max_opposite_strand_overlap_fraction: {type: number, minimum: 0, maximum: 1}
      antifam:
        type: object
        required: [db, threshold]
        properties:
          db: {type: string}
          threshold: {type: string, enum: [cut_ga]}
  cascade:
    type: object
    required: [narrow_at, min_explained, sweep_cohort_fraction]
    properties:
      narrow_at: {type: number, minimum: 0, maximum: 1}
      min_explained: {type: number, minimum: 0, maximum: 1}
      sweep_cohort_fraction: {type: number, minimum: 0, maximum: 1}
  controls:
    type: object
    required: [positive, negative]
  seed: {type: integer}
