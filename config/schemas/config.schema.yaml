$schema: "https://json-schema.org/draft/2020-12/schema"
description: plasmid annotation pipeline configuration
type: object
properties:
  working_set_fasta: {type: string}
  master_table: {type: string}
  outdir: {type: string}
  n_shards: {type: integer, minimum: 1}
  exclude_hab_top:
    type: array
    items: {type: string}
required: [working_set_fasta, master_table, outdir, n_shards, exclude_hab_top]
