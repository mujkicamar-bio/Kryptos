# Schema for config/config.yaml, validated when the Snakefile loads. Unknown keys are
# refused, so a misspelt key fails at load time instead of falling back to a default.
$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required: [input, outdir, orf, seed,
           references, labels, amrfinder, genomad, foldseek_db, prostt5_model]
additionalProperties: false
properties:
  input:
    type: object
    required: [master_table, fasta, exclude_hab_top, plasmidscope_proteins,
               max_plasmid_size_bp, host_provenance, working_set, ncbi_taxdump]
    additionalProperties: false
    properties:
      exclude_hab_top: {type: array, items: {type: string}}
      master_table: {type: string}
      host_provenance: {type: string}
      working_set: {type: string}
      ncbi_taxdump: {type: string}
      fasta: {type: string}
      max_plasmid_size_bp: {type: integer, minimum: 1}
      plasmidscope_proteins: {type: string}
  outdir: {type: string}
  orf:
    type: object
    required: [min_call_length_aa, min_terminal_repeat_bp]
    additionalProperties: false
    properties:
      min_call_length_aa: {type: integer, minimum: 1}
      min_terminal_repeat_bp: {type: integer, minimum: 1}
  references:
    type: object
    required: [pfam_dat, pfam_version, swissprot_version, nr_version, eggnog_version,
               pharokka_db_version, macsyfinder_models, conjscan_models]
    additionalProperties: false
    properties:
      pfam_dat: {type: string}
      pfam_version: {type: string}
      swissprot_version: {type: string}
      nr_version: {type: string}
      eggnog_version: {type: string}
      pharokka_db_version: {type: string}
      macsyfinder_models: {type: string}
      conjscan_models: {type: string}
  # The label databases and AMRFinderPlus (rule label_databases).
  labels:
    type: object
    required: [dir, required]
    additionalProperties: false
    properties:
      dir: {type: string}
      required: {type: boolean}
  amrfinder:
    type: object
    required: [executable, database, required]
    additionalProperties: false
    properties:
      executable: {type: string}
      database: {type: string}
      required: {type: boolean}
  genomad:
    type: object
    required: [executable, database]
    additionalProperties: false
    properties:
      executable: {type: string}
      database: {type: string}
  seed: {type: integer}
  foldseek_db: {type: string}
  prostt5_model: {type: string}
  # Alternative cascade and targets files for the test and benchmark runs (Snakefile).
  cascade_config: {type: string}
  targets_config: {type: string}
