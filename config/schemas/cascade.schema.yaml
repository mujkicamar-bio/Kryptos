# JSON schema for config/cascade.yaml.
#
# This checks SHAPE and RANGE. It cannot check relationships between fields - that
# narrow_at must not be stricter than min_coverage, for instance - so every entry point
# also calls plasmidann.cascade.check_thresholds(), which raises on incoherent
# combinations. Together they ensure that no threshold reaches a search without having
# been declared and validated.
$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
properties:

  narrow_at:
    type: number
    minimum: 0
    maximum: 1
    description: >
      Explained fraction at or above which a protein stops being searched by deeper tiers.
      Must be >= min_coverage (enforced by check_thresholds).

  min_coverage:
    type: number
    minimum: 0
    maximum: 1
    description: >
      Merged informative coverage at or above which a protein is FUNCTIONAL rather than
      DOMAIN_ONLY. Applied to the protein, never to a single alignment.

  full_at:
    type: number
    minimum: 0
    maximum: 1

  partial_at:
    type: number
    minimum: 0
    maximum: 1

  hmmer_z:
    type: integer
    minimum: 1
    description: >
      Fixed database size passed to every hmmer tier as -Z and --domZ, so an E-value means
      the same thing on every tier and does not move when an upstream stage changes.

  max_target_seqs:
    type: integer
    minimum: 1

  search_clustering:
    type: object
    additionalProperties: false
    required: [min_seq_id, coverage, cov_mode, cluster_mode]
    properties:
      min_seq_id: {type: number, exclusiveMinimum: 0, maximum: 1}
      coverage: {type: number, minimum: 0, maximum: 1}
      cov_mode: {type: integer, enum: [0, 1, 2]}
      cluster_mode: {type: integer, enum: [0, 1, 2]}
    description: >
      Identity and coverage of the clustering whose representatives the cascade searches;
      members take their representative's result.

  tiers:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^T[0-9]+$"
        method:
          type: string
          enum: [hmmer, pharokka, diamond]
        # The database the tier searches, as every hits.tsv row carries it. It decides a
        # label's kind downstream, independently of the tier's position in the list.
        source:
          type: string
          enum: [pfam, pharokka, swissprot, nr]
        db:
          type: string
        # pharokka tiers only: the executable, by path. pharokka runs in its own
        # environment and is not on the pipeline's PATH.
        exe:
          type: string
        args:
          type: string
        max_evalue:
          # null means the tier has no E-value criterion. T1 uses Pfam gathering
          # thresholds, which are per-family and can be looser than any global cut.
          type: [number, "null"]
          exclusiveMinimum: 0
        # Proteins an earlier tier named (an informative hit) from one of these sources
        # are not searched by this tier.
        skip_if_named_by:
          type: array
          items: {type: string, enum: [pfam, pharokka, swissprot, nr]}
        # DIAMOND tiers: the sequence count the built index must hold (checked at
        # preflight with diamond dbinfo).
        expected_sequences:
          type: integer
          minimum: 1
        note:
          type: string
      required: [id, method, source, db, args, max_evalue]

  artefact_screen:
    type: object
    additionalProperties: false
    properties:
      antifam_db: {type: string}
      antifam_args: {type: string}
      # null means the tool's own curated threshold decided the hit.
      antifam_max_evalue: {type: [number, 'null'], exclusiveMinimum: 0}
      max_low_complexity_fraction: {type: number, minimum: 0, maximum: 1}
    required: [antifam_db, antifam_args, antifam_max_evalue,
               max_low_complexity_fraction]

required:
  - search_clustering
  - narrow_at
  - min_coverage
  - full_at
  - partial_at
  - hmmer_z
  - max_target_seqs
  - tiers
  - artefact_screen
