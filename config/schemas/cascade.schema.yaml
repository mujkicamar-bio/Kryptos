$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  min_explained: {type: number, minimum: 0, maximum: 1}
  tiers:
    type: array
    minItems: 1
    items:
      type: object
      properties:
        id: {type: string, pattern: "^T[0-9]+$"}
        method: {type: string, enum: [hmmer, diamond, hhblits, foldseek, eggnogmapper]}
        db: {type: string}
        args: {type: string}
        note: {type: string}
      required: [id, method, db, args]
required: [tiers, min_explained]
