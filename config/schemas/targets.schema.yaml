# Schema for config/targets.yaml. Shape and range only; relations between keys are
# checked in the Snakefile at load time.
$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
properties:
  network:
    type: object
    required: [node_resolution, min_cov, max_evalue, max_out_edges, dark_brightness]
    properties:
      node_resolution: {type: string}
      min_cov: {type: number, minimum: 0, maximum: 1}
      max_evalue: {type: number, exclusiveMinimum: 0}
      max_out_edges: {type: integer, minimum: 1}
      dark_brightness: {type: number, minimum: 0, maximum: 1}
  clustering:
    type: object
    required:
    - resolutions
    - primary
    - cov_mode
    - cluster_mode
    properties:
      resolutions:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          required:
          - min_seq_id
          - coverage
          properties:
            min_seq_id:
              type: number
              minimum: 0
              maximum: 1
            coverage:
              type: number
              minimum: 0
              maximum: 1
      primary:
        type: string
      cov_mode:
        type: integer
      cluster_mode:
        type: integer
  evolution:
    type: object
    properties:
      min_codons:
        type: integer
        minimum: 1
      min_members_for_dnds:
        type: integer
        minimum: 2
      dnds_purifying_max:
        type: number
        exclusiveMinimum: 0
      rnacode_max_p:
        type: number
        exclusiveMinimum: 0
      max_members_aligned:
        type: integer
        minimum: 2
    required:
    - min_codons
    - min_members_for_dnds
    - dnds_purifying_max
    - max_members_aligned
    - rnacode_max_p
  defence:
    type: object
    required:
    - required
    properties:
      required:
        type: boolean
  # S8f CONJScan (rule conjugation_systems). exe is the MacSyFinder of envs/conjscan,
  # named by path; version is the CONJScan release the calls are stamped with.
  conjugation:
    type: object
    required: [required, exe, version]
    additionalProperties: false
    properties:
      required: {type: boolean}
      exe: {type: string}
      version: {type: string}
  # Stage 9: the clustering levels synteny is measured at, and the lineage minimum.
  synteny:
    type: object
    required: [levels, min_lineages]
    additionalProperties: false
    properties:
      levels:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string}
      min_lineages: {type: integer, minimum: 2}
  # S8g: dark sequence co-occurrence - the lineage minimum for a reported pair, and the FDR.
  cooccurrence:
    type: object
    required: [min_lineages_together, fdr]
    additionalProperties: false
    properties:
      min_lineages_together: {type: integer, minimum: 2}
      fdr: {type: number, exclusiveMinimum: 0, maximum: 1}
  context:
    type: object
    properties:
      max_operon_gap:
        type: integer
        minimum: 0
      neighbourhood_window:
        type: integer
        minimum: 1
    required:
    - max_operon_gap
    - neighbourhood_window
  orthology:
    type: object
    properties:
      data_dir:
        type: string
      required:
        type: boolean
    required:
    - data_dir
    - required
  structure:
    type: object
    properties:
      max_evalue:
        type: number
        exclusiveMinimum: 0
      required:
        type: boolean
      gpu:
        type: boolean
      scope:
        enum:
        - representatives
        - all
    required:
    - max_evalue
    - required
  lineage:
    type: object
    required:
    - max_distance
    - max_pvalue
    - kmer
    - sketch_size
    properties:
      max_distance:
        type: number
        minimum: 0
        maximum: 1
      max_pvalue:
        type: number
        minimum: 0
        maximum: 1
      kmer:
        type: integer
        minimum: 1
      sketch_size:
        type: integer
        minimum: 1
  rarity:
    type: object
    required:
    - rare_max_lineages
    - widespread_percentile
    - cross_min_hosts
    - cross_min_genera
    - rarefaction_replicates
    properties:
      rare_max_lineages:
        type: integer
        minimum: 1
      widespread_percentile:
        type: number
        exclusiveMinimum: 0
        maximum: 100
      cross_min_hosts:
        type: integer
        minimum: 1
      cross_min_genera:
        type: integer
        minimum: 1
      rarefaction_replicates:
        type: integer
        minimum: 1
required:
- clustering
- network
- evolution
- orthology
- context
- structure
- conjugation
- synteny
- cooccurrence
- lineage
- rarity
- defence
