# Cost-measurement configuration: the 100-plasmid set, every production tier.
#
# Run with:
#   sbatch workflow/bench_pipeline.sbatch
#
# This is NOT the smoke set. config/test/ answers "does the pipeline run"; this answers
# "what will the production run cost", and the two questions need different tier sets.
# The smoke set omits nr because nr would make a correctness check cost a production run
# (config/test/README.md). A cost measurement that omits nr measures everything except
# the stage that dominates, so here the cascade has five tiers, T5 on full nr
# (config/bench/cascade.yaml).
#
# Overrides config/config.yaml, which the Snakefile always loads first; keys not set here
# are the production values. Against config/test/config.yaml it sets:
#
#   outdir          results_bench, so a cost run never overwrites a smoke run.
#   cascade_config  config/bench/cascade.yaml, five tiers at test scale.
#
# The plasmid set and the 100 + 100 controls are those of the test configuration, so
# hmmer_z stays 5504: -Z counts the unique proteins and the controls.
#
# What the resulting numbers can and cannot support is in the header of
# workflow/bench_pipeline.sbatch. In short: per-stage memory transfers to production,
# per-stage wall time does not transfer by simple multiplication.
input:
  master_table: data/plasmidscope_primary/analysis_set.tsv
  fasta: data/test_plasmids.fna
  exclude_hab_top:
  - Simulated-artifact
  max_plasmid_size_bp: 20000
  plasmidscope_proteins: data/PlasmidScope/annotation/ALL.protein_list.tsv.gz
outdir: results_bench
orf:
  min_call_length_aa: 20
discovery:
  min_dark_candidate_length_aa: 20
references:
  pfam_dat: data/refs/pfam/Pfam-A.hmm.dat.gz
  pfam_version: '38.2'
  swissprot_version: '2025-03-03'
  nr_version: '2025-03-03'
  eggnog_version: 5.0.2
  # The pharokka database bundle, from data/refs/pharokka/VERSION_x_y_z. One version
  # covers the phage families (PHROG v4 table), CARD and VFDB together.
  pharokka_db_version: "1.8.0"
  macsyfinder_models: data/refs/macsyfinder
  conjscan_models: data/refs/conjscan
  kegg_ko_list: data/refs/labels/kegg_ko/raw/list_ko.txt
labels:
  dir: data/refs/labels
  required: true
amrfinder:
  executable: envs/amrfinder/bin/amrfinder
  database: data/refs/amrfinder/latest
  required: true
qc:
  max_opposite_strand_overlap_fraction: 0.6
controls:
  positive:
    raw_faa: data/refs/control/raw.faa
    n: 100
  negative:
    n_shuffled: 50
    n_reverse_complement: 50
    min_length: 50
seed: 20260916
cascade_config: config/bench/cascade.yaml
