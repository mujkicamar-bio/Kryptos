# Cost-measurement cascade: five tiers, as in production, at test scale. Unlike
# config/test/cascade.yaml it has a T5, because T5 dominates the cost.
#
# Differs from config/cascade.yaml in two ways:
#
#   hmmer_z  5297, as in config/test/cascade.yaml: every unique protein of the test set.
#            Rule check_hmmer_z accepts a 2% difference.
#
#   T5       full NCBI nr without skip_if_named_by, not ClusteredNR with it, so its cost
#            describes a full-nr cascade. -b 16 -c 1, as in production: with DIAMOND's
#            defaults (-b 2 -c 4) 2,000 queries did not finish against nr in 12 hours
#            (job 6823981); with -b 16 -c 1 the same pass took 45-69 minutes on a full
#            node (job 6928733).
#
# Every other threshold is identical to production.
narrow_at: 0.7
min_explained: 0.5
min_coverage: 0.5
full_at: 0.8
partial_at: 0.5
hmmer_z: 5297
max_target_seqs: 25
sweep_cohort_fraction: 0.02
# Search clustering, as in config/cascade.yaml.
search_clustering:
  min_seq_id: 0.9
  coverage: 0.8
  cov_mode: 0
  cluster_mode: 2

tiers:
- id: T1
  method: hmmer
  source: pfam
  db: data/refs/pfam/Pfam-A.hmm
  args: --cut_ga
  max_evalue: null
  note: 'Pfam-A 38.2 at curated gathering thresholds. A hit here is Pfam''s own assertion
    of family membership, not our inference. High precision, deliberately low recall.

    '
- id: T2
  method: hmmer
  source: pfam
  db: data/refs/pfam/Pfam-A.hmm
  args: -E 1e-5 --domE 1e-5 --incdomE 1e-5
  max_evalue: 1.0e-05
  note: 'The same database below the curatorial bar, recovering divergent homologues
    - which is most of the plasmid mobilome. Kept as a separate, clearly lower-authority
    claim so it can be down-weighted or stripped downstream. --domE is essential:
    -E sets only the SEQUENCE threshold, and without it every domain of a passing
    sequence is counted; 7.2% of T2 resolutions depended on domains that were not
    individually significant. DECIDED: this threshold stays at 1e-5. Measured over
    Pfam-A 38.2, the curated GA of 29,074 of 30,134 families (96.5%) corresponds to
    an E-value looser than 1e-5 at Z=3,497,616 - median E-at-GA 7.6e-4, median GA
    27.0 bits against the 32.9 bits E=1e-5 demands. So for most families T2 is the
    stricter of the two tiers and adds little beyond re-finding T1''s domains, and
    it does its intended sub-GA job only for the remaining 3.5%. Loosening it would
    open a real sub-GA band at the cost of false positives across 3.5M queries, and
    a false positive here permanently removes a genuine dark protein from the pool.
    That trade was considered and declined: precision at the deepest tiers is worth
    more to this project than sub-GA recall. The measurement is kept in docs/annotation_statistics.md
    section 2 so the choice is on the record.

    '
- id: T3
  method: pharokka
  source: pharokka
  db: data/refs/pharokka
  exe: envs/pharokka/bin/pharokka
  args: ''
  max_evalue: 1.0e-05
  note: 'The phage tier, identical to production: pharokka is small enough that there is
    no reason to substitute anything, and the point of the smoke run is the real tier.

    '
- id: T4
  method: diamond
  source: swissprot
  db: /sw/data/diamond_databases/Blast/latest/swissprot.dmnd
  args: --very-sensitive
  max_evalue: 1.0e-05
  note: 'Swiss-Prot, 264 MB. Highest label quality available and nearly free; measured
    to clear 16.3% of Pfam''s residue in seconds.

    '
- id: T5
  method: diamond
  source: nr
  db: /sw/data/diamond_databases/Blast/latest/nr.dmnd
  args: --very-sensitive -b 16 -c 1
  max_evalue: 1.0e-05
  note: 'NCBI nr, 375 GB. Reaches environmental sequence nothing else has. UniRef90 was
    dropped from the cascade after review measured it at 3-11 days for little beyond
    what nr already provides. -b 16 -c 1 is measured, not guessed: see the file header.

    '
artefact_screen:
  antifam_db: data/refs/antifam/AntiFam.hmm
  antifam_args: --cut_ga
  antifam_max_evalue: null
  max_low_complexity_fraction: 0.5
